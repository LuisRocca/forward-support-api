sonar.projectKey=forward-support-api
sonar.projectName=Plataforma de Soporte - API

sonar.sources=src
# El cliente de Prisma generado no es código del proyecto: analizarlo llenaría
# el informe de avisos ajenos y distorsionaría la cobertura.
sonar.exclusions=src/generated/**,**/*.spec.ts,**/test-doubles.ts

# Los unitarios viven junto al código (src/**/*.spec.ts) y los e2e en test/.
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*-spec.ts,**/test-doubles.ts

# Cobertura: se genera con `pnpm test:cov` ANTES del análisis (unitarios y e2e
# por separado; Sonar combina los dos informes). Sin ese paso, reporta 0%.
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/e2e/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

sonar.sourceEncoding=UTF-8
