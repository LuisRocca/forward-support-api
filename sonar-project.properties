sonar.projectKey=forward-support-api
sonar.projectName=Plataforma de Soporte - API

sonar.sources=src
sonar.tests=test
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/coverage/**
sonar.test.inclusions=**/*.spec.ts,test/**

# Cobertura: se genera con `pnpm test:cov` ANTES de lanzar el análisis.
# Sin ese paso previo, Sonar reporta 0% y la métrica no significa nada.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

sonar.sourceEncoding=UTF-8
